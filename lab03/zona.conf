# ---------------------------------------------------------------------
# Archivo de zona de ejemplo - Laboratorio 3 (Servidor DNS en C)
#
# Se carga con:   sudo ./dns_server -z zona.conf
#
# Estos registros se SUMAN a la zona de demostracion que el servidor trae
# compilada (lab.local. y 1.168.192.in-addr.arpa.).
#
# Formato de cada linea:
#
#   ZONE  <origen>                     -> declara un origen autoritativo
#   <nombre>  <ttl>  <TIPO>  <valor>   -> agrega un registro
#
# Tipos soportados: A, AAAA, NS, CNAME, SOA, PTR, MX, TXT, SRV
# Las lineas que empiezan con # o ; son comentarios.
# ---------------------------------------------------------------------

# Origen propio para la demostracion en la BeagleBone Black.
ZONE bbb.local.

bbb.local.            3600  SOA    ns1.bbb.local. admin.bbb.local. 1 7200 3600 1209600 3600
bbb.local.            3600  NS     ns1.bbb.local.
bbb.local.            3600  A      192.168.7.2
ns1.bbb.local.        3600  A      192.168.7.2

# Interfaz Ethernet y la USB tipica de la BeagleBone Black.
eth0.bbb.local.       3600  A      192.168.1.50
usb0.bbb.local.       3600  A      192.168.7.2
usb0.bbb.local.       3600  AAAA   fe80::1a2b:3cff:fe4d:5e6f

# Alias y servicios
web.bbb.local.        3600  CNAME  eth0.bbb.local.
bbb.local.            3600  MX     10 eth0.bbb.local.
bbb.local.             600  TXT    "Laboratorio 3 - servidor DNS en C sobre Debian"
_http._tcp.bbb.local. 3600  SRV    10 5 80 eth0.bbb.local.

# Resolucion inversa para la red del laboratorio.
ZONE 7.168.192.in-addr.arpa.

7.168.192.in-addr.arpa.   3600  SOA  ns1.bbb.local. admin.bbb.local. 1 7200 3600 1209600 3600
2.7.168.192.in-addr.arpa. 3600  PTR  usb0.bbb.local.
