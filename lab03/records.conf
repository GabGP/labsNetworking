# Custom Zone Records Configuration File
# Format: Name Type Value1 [Value2] [TTL]

# IPv4 Address Records (Type A)
beaglebone.local    A       192.168.1.100       300
lab3.test           A       127.0.0.1           300
myserver.lan        A       192.168.1.50        600

# IPv6 Address Records (Type AAAA)
beaglebone.local    AAAA    fe80::100           300
lab3.test           AAAA    ::1                 300
myserver.lan        AAAA    2001:db8::50        600

# Reverse DNS Records (Type PTR)
100.1.168.192.in-addr.arpa  PTR beaglebone.local  300
1.0.0.127.in-addr.arpa      PTR localhost         300

# Canonical Name Alias (Type CNAME)
www.lab3.test       CNAME   lab3.test           300
api.lab3.test       CNAME   myserver.lan        600

# Text Records (Type TXT)
lab3.test           TXT     "v=spf1 redirect=_spf.google.com" 300
