; Keyless WEP station for the Lab #10 test (ESP32-C3 Super Mini, ESP-IDF framework).
; Board settings match TutorBox/firmware/clicker/platformio.ini, which works on this board.
;
;   pio run                 build (the first build downloads ESP-IDF and the toolchain)
;   pio run -t upload       flash over USB
;   pio device monitor      serial log at 115200

[env:esp32c3-supermini]
platform = espressif32 @ 7.1.3
board = esp32-c3-devkitm-1
framework = espidf
; Super Mini clones boot reliably in DIO flash mode.
board_build.flash_mode = dio
monitor_speed = 115200
upload_speed = 460800
; The last upload step resets the board over RTS. On this board that drops its USB port, and the step
; fails with "Input/output error" after the firmware is already written and verified. Skip that step
; instead, and press RESET on the board after each upload.
board_upload.after_reset = no_reset
